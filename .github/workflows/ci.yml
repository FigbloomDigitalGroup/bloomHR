name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Existing type errors are recorded in scripts/types-baseline.json; this fails only if a change adds more.
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
