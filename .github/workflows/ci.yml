name: CI

on:
  pull_request:
    branches: [main]

# A newer push to the same PR cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # lint, typecheck and the production build, side by side
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, bundle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - if: matrix.check == 'lint'
        run: npm run lint
      # Existing type errors are recorded in scripts/types-baseline.json; this fails only if a change adds more.
      - if: matrix.check == 'typecheck'
        run: npm run typecheck
      - if: matrix.check == 'bundle'
        run: npm run build

  # the test suite split across 6 machines (vitest --shard)
  test:
    name: test (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/6

  # The branch rule requires a check called "build": it passes only when every job above passed. It runs even when a
  # job failed or was cancelled (always()), so a failure can never be reported as "skipped" (which would count as passing).
  build:
    runs-on: ubuntu-latest
    needs: [checks, test]
    if: always()
    steps:
      - name: Every check passed
        run: |
          if [ "${{ needs.checks.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "checks: ${{ needs.checks.result }}, tests: ${{ needs.test.result }}"
            exit 1
          fi
